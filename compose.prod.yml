services:
  web:
    image: ghcr.io/arkhe-ai/shussei-web:latest
    env_file: .env

  api:
    image: ghcr.io/arkhe-ai/shussei-api:latest
    env_file: .env

  caddy:
    image: caddy:2
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  caddy_data:
  caddy_config:
