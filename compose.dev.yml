services:
  web:
    build:
      context: ../shussei-web
    env_file: .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
    ports:
      - '3000:3000'
    depends_on:
      - api

  api:
    build:
      context: ../shussei-api
    env_file: .env
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/shussei
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
      LIVEKIT_WS_URL: ws://localhost:7880
    ports:
      - '3001:3001'
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: shussei
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5432:5432'

  redis:
    image: redis:7
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - '6379:6379'

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit/livekit.yaml
    env_file: .env
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro
    ports:
      - '7880:7880'
      - '7881:7881'
    depends_on:
      - redis

  coturn:
    image: coturn/coturn:4.6
    env_file: .env
    command: -c /etc/coturn/turnserver.conf
    volumes:
      - ./turn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - '3478:3478/tcp'
      - '3478:3478/udp'
      - '5349:5349/tcp'

  caddy:
    image: caddy:2
    ports:
      - '80:80'
    volumes:
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - api
